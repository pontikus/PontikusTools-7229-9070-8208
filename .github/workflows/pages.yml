# Publishes the Pontikus Boatyard to GitHub Pages every time main changes.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies (web app only)
        run: bun install --filter './packages/web'
      - name: Build
        working-directory: packages/web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: bunx vite build
      - name: Make direct tool links work
        run: |
          cp packages/web/dist/index.html packages/web/dist/404.html
          # Give every tool its own real page so /tools/<slug> loads with a normal status code.
          for slug in $(grep -o 'slug: "[^"]*"' packages/web/src/web/lib/catalogue.ts | cut -d'"' -f2); do
            mkdir -p "packages/web/dist/tools/$slug"
            cp packages/web/dist/index.html "packages/web/dist/tools/$slug/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
